name: iPad October 22 UI package
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download private Xcode export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build
          gh api "repos/$GITHUB_REPOSITORY/releases/419768396" --jq '.assets[] | [.id, .name] | @tsv' | while IFS=$'\t' read -r id name; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "build/$name"
          done
          tr -d '\r' < build/SHA256SUMS.txt > build/SHA256SUMS-unix.txt
          (cd build && shasum -a 256 -c SHA256SUMS-unix.txt)
          unzip -q build/OCEAN-Xcode.zip -d build/iOS
          find build/iOS -type f \( -name '*.sh' -o -name il2cpp -o -name bee_backend -o -name UnityLinker \) -exec chmod +x {} +
      - name: Build unsigned iPad app
        run: bash ci/package-ipad.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iPad-ui-20261022-unsigned
          path: build/ipa/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: iPad-ui-20261022-build-logs
          path: build/xcodebuild.log
