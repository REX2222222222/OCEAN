name: Convert ocean 69-class model
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download private model inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs
          gh api "repos/$GITHUB_REPOSITORY/releases/451012862" --jq '.assets[] | [.id, .name] | @tsv' | while IFS=$'\t' read -r id name; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "inputs/$name"
          done
      - name: Install conversion runtime
        run: |
          pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics==8.4.60 onnx onnxruntime
      - name: Export ONNX and compare inference
        run: python inputs/export_model69.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model69-converted
          path: converted/*
          if-no-files-found: error
          retention-days: 7
