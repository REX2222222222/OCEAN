name: iPad learning-time package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download private Xcode export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build
          gh release download ios-xcode-20261019-learning-times --repo "$GITHUB_REPOSITORY" --dir build --pattern OCEAN-Xcode.zip --pattern SHA256SUMS.txt
          (cd build && shasum -a 256 -c SHA256SUMS.txt)
          unzip -q build/OCEAN-Xcode.zip -d build/iOS
          find build/iOS -type f \( -name '*.sh' -o -name il2cpp -o -name bee_backend -o -name UnityLinker \) -exec chmod +x {} +
      - name: Build unsigned iPad app
        run: bash ci/package-ipad.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iPad-learning-times-unsigned
          path: build/ipa/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: iPad-learning-times-build-logs
          path: build/xcodebuild.log
